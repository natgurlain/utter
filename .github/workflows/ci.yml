name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Test and build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Unit tests
        run: swift test

      - name: Metal Toolchain (MLX shaders)
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build app bundle (ad-hoc signed)
        run: SIGN_IDENTITY=- scripts/build-app.sh release
